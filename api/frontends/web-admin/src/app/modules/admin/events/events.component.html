<div class="flex flex-col flex-auto min-w-0 bg-card dark:bg-transparent">
    <div class="flex-auto p-6 sm:p-10">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-semibold tracking-tight leading-8">Events</h1>
                <p class="text-secondary mt-1">11 total events — drag to reschedule.</p>
            </div>
            <div class="flex items-center gap-4">
                <mat-button-toggle-group 
                    [value]="currentView()" 
                    (change)="onViewChange($event.value)" 
                    class="h-10">
                    <mat-button-toggle value="table" class="px-2">
                        <mat-icon class="icon-size-5" svgIcon="heroicons_outline:list-bullet"></mat-icon>
                        <span class="ml-1 hidden sm:inline">Table</span>
                    </mat-button-toggle>
                    <mat-button-toggle value="calendar" class="px-2">
                        <mat-icon class="icon-size-5" svgIcon="heroicons_outline:calendar"></mat-icon>
                        <span class="ml-1 hidden sm:inline">Calendar</span>
                    </mat-button-toggle>
                    <mat-button-toggle value="kanban" class="px-2">
                        <mat-icon class="icon-size-5" svgIcon="heroicons_outline:view-columns"></mat-icon>
                        <span class="ml-1 hidden sm:inline">Kanban</span>
                    </mat-button-toggle>
                </mat-button-toggle-group>

                <button mat-flat-button color="primary" routerLink="new">
                    <mat-icon class="icon-size-5" svgIcon="heroicons_outline:plus"></mat-icon>
                    <span class="ml-2">New event</span>
                </button>
            </div>
        </div>

        <!-- Filters -->
        <div class="flex items-center gap-4 mb-6">
            <span class="text-secondary font-medium">Filter:</span>
            <mat-chip-set>
                <mat-chip-option (click)="toggleTypeFilter('open-day')" [selected]="typeFilter() === 'open-day'" class="bg-gray-100 dark:bg-gray-800">
                    <span class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-purple-500"></span> Open Day
                    </span>
                </mat-chip-option>
                <mat-chip-option (click)="toggleTypeFilter('webinar')" [selected]="typeFilter() === 'webinar'" class="bg-gray-100 dark:bg-gray-800">
                    <span class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-teal-500"></span> Webinar
                    </span>
                </mat-chip-option>
                <mat-chip-option (click)="toggleTypeFilter('info-session')" [selected]="typeFilter() === 'info-session'" class="bg-gray-100 dark:bg-gray-800">
                    <span class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-green-500"></span> Info Session
                    </span>
                </mat-chip-option>
                <mat-chip-option (click)="toggleTypeFilter('campus-tour')" [selected]="typeFilter() === 'campus-tour'" class="bg-gray-100 dark:bg-gray-800">
                    <span class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-amber-500"></span> Campus Tour
                    </span>
                </mat-chip-option>
                <mat-chip-option (click)="toggleTypeFilter('fair')" [selected]="typeFilter() === 'fair'" class="bg-gray-100 dark:bg-gray-800">
                    <span class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-red-500"></span> Fair
                    </span>
                </mat-chip-option>
            </mat-chip-set>
        </div>

        <!-- Content Router Outlet -->
        <div>
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
