apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: schoolcrm
resources:
  - ../../base/auth/
components:
  - ../hardened
patches:
  - path: ./vps-auth-patch-deploy.yaml
  - path: ./vps-auth-patch-service.yaml
images:
  - name: auth-image
    newName: localhost/schoolcrm/auth
    newTag: set-by-deploy
