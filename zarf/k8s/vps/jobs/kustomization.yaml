# One-off migrations. Apply explicitly after the database restore and before the
# services start (see docs/vps-deployment.md); delete the Jobs before re-running.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: schoolcrm
resources:
  - ./vps-migrate-jobs.yaml
images:
  - name: schoolcrm-image
    newName: localhost/schoolcrm/schoolcrm
    newTag: set-by-deploy
  - name: rag-image
    newName: localhost/schoolcrm/rag
    newTag: set-by-deploy
