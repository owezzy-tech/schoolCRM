apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: schoolcrm
resources:
  - ../../base/schoolcrm/
components:
  - ../hardened
patches:
  - path: ./vps-schoolcrm-patch-deploy.yaml
  - path: ./vps-schoolcrm-patch-service.yaml
images:
  - name: schoolcrm-image
    newName: localhost/schoolcrm/schoolcrm
    newTag: set-by-deploy
