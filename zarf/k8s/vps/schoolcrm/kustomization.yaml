apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: schoolcrm
resources:
  - ../../base/schoolcrm/
patches:
  # platform/ owns the Namespace (with pod-security labels); don't re-apply the base copy.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: schoolcrm-system
  - path: ./vps-schoolcrm-patch-deploy.yaml
  - path: ./vps-schoolcrm-patch-service.yaml
images:
  - name: schoolcrm-image
    newName: localhost/schoolcrm/schoolcrm
    newTag: set-by-deploy
