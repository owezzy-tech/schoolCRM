apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-admin
  namespace: schoolcrm-system
spec:
  replicas: 1
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: site
          emptyDir:
            sizeLimit: 64Mi
        - name: caddy-data
          emptyDir:
            sizeLimit: 16Mi
        - name: caddy-config
          emptyDir:
            sizeLimit: 4Mi
      # The entrypoint writes the Maps key into index.html, so serve a writable copy
      # of the built site instead of making the image filesystem writable.
      initContainers:
        - name: copy-site
          image: web-admin-image
          imagePullPolicy: IfNotPresent
          command: [cp, -R, /srv/., /site/]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: site
              mountPath: /site
      containers:
        - name: web-admin
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          volumeMounts:
            - name: site
              mountPath: /srv
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
          env:
            - name: PORT
              value: "8080"
            - name: RAG_API_UPSTREAM
              value: rag-service:7000
            # Browser-visible Maps key (restrict it by HTTP referrer in Google Cloud); optional.
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                configMapKeyRef: null
                secretKeyRef:
                  name: web-admin-env
                  key: google_maps_api_key
                  optional: true
