# Outbound-only connector for the remotely managed Cloudflare Tunnel that serves
# schoolcrm.owenadirah.com. Configure the tunnel's public hostname in Cloudflare
# Zero Trust to http://web-admin-service.schoolcrm.svc.cluster.local:80.
# No host ports: :80 stays free for certbot on this node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: schoolcrm
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.0
          args: [tunnel, --no-autoupdate, --metrics, 0.0.0.0:2000, run]
          env:
            # Tunnel token from Cloudflare Zero Trust (Networks > Tunnels).
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
