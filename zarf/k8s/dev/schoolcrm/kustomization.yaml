apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/schoolcrm/
  - ./dev-schoolcrm-configmap.yaml
patches:
  - path: ./dev-schoolcrm-patch-deploy.yaml
  - path: ./dev-schoolcrm-patch-service.yaml
images:
  - name: schoolcrm-image
    newName: localhost/schoolcrm/schoolcrm
    newTag: 0.0.1
  - name: metrics-image
    newName: localhost/schoolcrm/metrics
    newTag: 0.0.1
