apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-admin
  namespace: schoolcrm-system

spec:
  replicas: 1

  strategy:
    type: Recreate

  template:
    spec:
      containers:
        - name: web-admin
          ports:
            - name: http
              containerPort: 80
              hostPort: 30080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
