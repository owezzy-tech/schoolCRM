apiVersion: v1
kind: Namespace
metadata:
  name: schoolcrm-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag
  namespace: schoolcrm-system

spec:
  selector:
    matchLabels:
      app: rag

  template:
    metadata:
      labels:
        app: rag

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: rag
          image: rag-image

          ports:
            - name: rag
              containerPort: 7000

          readinessProbe:
            httpGet:
              path: /v1/readiness
              port: rag
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /v1/liveness
              port: rag
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 2

          env:
            - name: RAG_API_HOST
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: api_host
                  optional: true
            - name: RAG_API_PORT
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: api_port
                  optional: true
            - name: RAG_ALLOW_ANONYMOUS
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: allow_anonymous
                  optional: true
            - name: RAG_AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: auth_service_url
                  optional: true
            - name: RAG_AUTH_REQUEST_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: auth_request_timeout_seconds
                  optional: true
            - name: RAG_FILE_STORAGE_DIR
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: file_storage_dir
                  optional: true
            - name: RAG_GRAPH_RETRIEVER
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: graph_retriever
                  optional: true
            - name: RAG_NEO4J_URI
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: neo4j_uri
                  optional: true
            - name: RAG_NEO4J_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rag-secret
                  key: neo4j_username
                  optional: true
            - name: RAG_NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-secret
                  key: neo4j_password
                  optional: true
            - name: RAG_ADMISSIONS_ANSWER_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: admissions_answer_provider
                  optional: true
            - name: RAG_OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: ollama_base_url
                  optional: true
            - name: RAG_OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: ollama_model
                  optional: true
            - name: RAG_OLLAMA_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: ollama_timeout_seconds
                  optional: true

            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBERNETES_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBERNETES_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: schoolcrm-system

spec:
  selector:
    app: rag
