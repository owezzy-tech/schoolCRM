services:
  database:
    image: postgres:18.3-alpine3.22
    container_name: database
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./database-data:/var/lib/postgresql/18/docker
      - ./pg_hba.conf:/etc/pg_hba.conf
    command: ["-c", "hba_file=/etc/pg_hba.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpu_count: 2
    networks:
      schoolcrm-system-network:
        ipv4_address: 10.5.0.2

  init-migrate-seed:
    image: localhost/schoolcrm/schoolcrm:0.0.1
    pull_policy: never
    container_name: init-migrate-seed
    restart: unless-stopped
    entrypoint: ["./admin", "migrate-seed"]
    environment:
      - SCHOOLCRM_DB_USER=postgres
      - SCHOOLCRM_DB_PASSWORD=postgres
      - SCHOOLCRM_DB_HOST=database
      - SCHOOLCRM_DB_DISABLE_TLS=true
    networks:
      schoolcrm-system-network:
        ipv4_address: 10.5.0.10
    deploy:
      restart_policy:
        condition: none
    depends_on:
      - database

  auth:
    image: localhost/schoolcrm/auth:0.0.1
    pull_policy: never
    container_name: auth
    restart: unless-stopped
    ports:
      - "6000:6000"
      - "6001:6001"
      - "6010:6010"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:6000/v1/liveness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 2s
    cpu_count: 2
    environment:
      - GOMAXPROCS=2
      - AUTH_DB_USER=postgres
      - AUTH_DB_PASSWORD=postgres
      - AUTH_DB_HOST=database
      - AUTH_DB_DISABLE_TLS=true
      - KUBERNETES_NAMESPACE=compose
      - KUBERNETES_NAME=schoolcrm-system
      - KUBERNETES_POD_IP=10.5.0.5
      - KUBERNETES_NODE_NAME=auth
    networks:
      schoolcrm-system-network:
        ipv4_address: 10.5.0.5
    depends_on:
      - database

  schoolcrm:
    image: localhost/schoolcrm/schoolcrm:0.0.1
    pull_policy: never
    container_name: schoolcrm
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3010:3010"
    environment:
      - GOMAXPROCS
      - GOGC=off
      - GOMEMLIMIT
      - SCHOOLCRM_DB_USER=postgres
      - SCHOOLCRM_DB_PASSWORD=postgres
      - SCHOOLCRM_DB_HOST=database
      - SCHOOLCRM_DB_DISABLE_TLS=true
      - SCHOOLCRM_AUTH_HOST=http://auth:6000
      - KUBERNETES_NAMESPACE
      - KUBERNETES_NAME
      - KUBERNETES_POD_IP
      - KUBERNETES_NODE_NAME
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/v1/liveness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 2s
    networks:
      schoolcrm-system-network:
        ipv4_address: 10.5.0.15
    depends_on:
      - init-migrate-seed

  rag:
    image: localhost/schoolcrm/rag:0.0.1
    pull_policy: never
    container_name: rag
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - RAG_API_HOST=0.0.0.0
      - RAG_API_PORT=7000
      - RAG_ALLOW_ANONYMOUS=true
      - RAG_FILE_STORAGE_DIR=/service/var/files
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/v1/liveness')"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 2s
    networks:
      schoolcrm-system-network:
        ipv4_address: 10.5.0.25
    depends_on:
      - auth

  web-admin:
    image: localhost/schoolcrm/web-admin:0.0.1
    pull_policy: never
    container_name: web-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - GOOGLE_MAPS_API_KEY=
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 2s
    networks:
      schoolcrm-system-network:
        ipv4_address: 10.5.0.30
    depends_on:
      - auth
      - schoolcrm

  metrics:
    image: localhost/schoolcrm/metrics:0.0.1
    pull_policy: never
    container_name: metrics
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "4010:4010"
      - "4020:4020"
    cpus: 1
    environment:
      - GOMAXPROCS=1
      - METRICS_COLLECT_FROM=http://schoolcrm:3010/debug/vars
    networks:
      schoolcrm-system-network:
        ipv4_address: 10.5.0.20
    depends_on:
      - schoolcrm

volumes:
  database: {}

networks:
  schoolcrm-system-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/24
