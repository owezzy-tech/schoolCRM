<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SchoolCRM — lesson planning &amp; school access</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5fa8'/%3E%3Cpath d='M16 6 9 10.5v11L16 26l7-4.5v-11Z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='2.8' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --font-display:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-mono:'SF Mono',ui-monospace,'Cascadia Code','Roboto Mono',Menlo,Consolas,monospace;

  --primary:oklch(0.47 0.12 262);
  --primary-hover:oklch(0.41 0.125 262);
  --primary-weak:oklch(0.95 0.03 262);
  --primary-weak-fg:oklch(0.38 0.11 262);
  --on-primary:oklch(0.99 0 0);

  --accent:oklch(0.56 0.10 195);
  --accent-hover:oklch(0.49 0.10 195);
  --accent-weak:oklch(0.95 0.04 195);
  --accent-weak-fg:oklch(0.39 0.09 195);

  --bg:oklch(0.972 0.005 255);
  --surface:oklch(1 0 0);
  --surface-2:oklch(0.982 0.004 255);
  --nav-bg:oklch(1 0 0);
  --fg:oklch(0.27 0.02 262);
  --fg-strong:oklch(0.21 0.02 262);
  --muted:oklch(0.53 0.02 262);
  --faint:oklch(0.66 0.015 262);
  --border:oklch(0.918 0.008 262);
  --border-strong:oklch(0.85 0.012 262);

  --danger:oklch(0.55 0.17 25);
  --danger-hover:oklch(0.48 0.17 25);
  --danger-weak:oklch(0.96 0.03 25);
  --danger-weak-fg:oklch(0.44 0.16 25);

  --warn:oklch(0.62 0.13 75);
  --warn-weak:oklch(0.96 0.05 85);
  --warn-weak-fg:oklch(0.44 0.11 70);

  --success:oklch(0.58 0.10 165);
  --success-weak:oklch(0.95 0.04 165);
  --success-weak-fg:oklch(0.41 0.09 165);

  --radius:10px;--radius-lg:14px;--radius-sm:7px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  --shadow-md:0 4px 14px rgba(16,24,40,.09),0 2px 4px rgba(16,24,40,.04);
  --shadow-lg:0 16px 40px rgba(16,24,40,.16),0 4px 10px rgba(16,24,40,.06);
  --nav-w:264px;--topbar-h:64px;
  --ring:0 0 0 3px oklch(0.47 0.12 262 / .28);
}
.dark{
  --primary:oklch(0.76 0.10 255);
  --primary-hover:oklch(0.82 0.09 255);
  --primary-weak:oklch(0.33 0.06 262);
  --primary-weak-fg:oklch(0.87 0.06 255);
  --on-primary:oklch(0.19 0.04 262);
  --accent:oklch(0.74 0.09 195);
  --accent-hover:oklch(0.80 0.08 195);
  --accent-weak:oklch(0.33 0.05 205);
  --accent-weak-fg:oklch(0.85 0.07 195);
  --bg:oklch(0.19 0.014 262);
  --surface:oklch(0.235 0.015 262);
  --surface-2:oklch(0.27 0.015 262);
  --nav-bg:oklch(0.215 0.015 262);
  --fg:oklch(0.93 0.008 262);
  --fg-strong:oklch(0.98 0.004 262);
  --muted:oklch(0.73 0.012 262);
  --faint:oklch(0.62 0.012 262);
  --border:oklch(0.315 0.015 262);
  --border-strong:oklch(0.40 0.016 262);
  --danger:oklch(0.68 0.16 25);
  --danger-hover:oklch(0.74 0.15 25);
  --danger-weak:oklch(0.32 0.07 25);
  --danger-weak-fg:oklch(0.86 0.08 25);
  --warn:oklch(0.78 0.12 80);
  --warn-weak:oklch(0.33 0.06 75);
  --warn-weak-fg:oklch(0.89 0.09 85);
  --success:oklch(0.74 0.10 165);
  --success-weak:oklch(0.32 0.05 165);
  --success-weak-fg:oklch(0.87 0.08 165);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.45);
  --shadow-lg:0 16px 40px rgba(0,0,0,.55);
  --ring:0 0 0 3px oklch(0.76 0.10 255 / .35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-body);font-size:14px;line-height:1.55;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;color:var(--fg-strong)}
p{margin:0 0 10px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
b,strong{font-weight:650}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
.skip-link{position:absolute;left:12px;top:-60px;z-index:200;background:var(--surface);border:1px solid var(--border-strong);border-radius:9px;padding:9px 14px;font-weight:600;transition:top .15s}
.skip-link:focus{top:12px}
.ico{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}

.shell{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100vh}
.nav{background:var(--nav-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:16px 12px;gap:2px;z-index:60}
.nav-brand{display:flex;align-items:center;gap:11px;padding:8px 8px 18px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none;box-shadow:var(--shadow-sm)}
.brand-mark svg{width:24px;height:24px}
.nav-brand-text b{font-family:var(--font-display);font-size:17.5px;letter-spacing:.01em;display:block;line-height:1.1;color:var(--fg-strong)}
.nav-brand-text small{color:var(--faint);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.nav-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);padding:16px 12px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:9.5px 11px;border-radius:9px;color:var(--muted);font-weight:550;transition:background .15s,color .15s}
.nav-item .ico{width:19px;height:19px}
.nav-item.active{background:var(--primary-weak);color:var(--primary-weak-fg);font-weight:650}
.nav-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:12px}
.nav-user{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:9px}
.nav-user small{display:block;color:var(--faint);font-size:11.5px}
.nav-backdrop{display:none}

.content{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:50;min-height:var(--topbar-h);display:flex;align-items:center;gap:14px;padding:10px 24px;background:color-mix(in oklch,var(--surface) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar-title{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--fg-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.icon-btn[aria-expanded="true"],.icon-btn.active{background:var(--surface-2);color:var(--fg);border-color:var(--border)}
.nav-toggle{display:none}
.role-switch{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:4px 6px 4px 12px;height:40px}
.role-switch-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700}
.role-switch select{border:0;background:transparent;font:inherit;font-weight:650;color:var(--fg);padding:3px 4px;border-radius:6px;cursor:pointer;max-width:150px}
.avatar-btn{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer;height:40px;transition:border-color .15s,background .15s}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-weak);color:var(--primary-weak-fg);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.avatar-meta{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.avatar-meta b{font-size:12.5px}
.avatar-meta small{color:var(--faint);font-size:10.5px}
.avatar-btn .ico{color:var(--faint);width:16px;height:16px}
.menu-pop{position:fixed;top:66px;right:24px;z-index:70;width:250px;background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow-lg);padding:7px;animation:pop .16s ease}
.menu-pop .menu-head{padding:10px 11px 11px;border-bottom:1px solid var(--border);margin-bottom:6px}
.menu-pop .menu-head b{display:block}
.menu-pop .menu-head small{color:var(--muted)}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 11px;border-radius:8px;cursor:pointer;font-weight:550;color:var(--fg);transition:background .15s}
.menu-item.danger{color:var(--danger)}

.main{padding:26px 30px 70px;max-width:1380px;margin:0 auto;width:100%}
.page-head{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-family:var(--font-display);font-size:27px;letter-spacing:-.01em;line-height:1.15}
.page-sub{color:var(--muted);margin-top:4px;max-width:62ch}
.page-actions{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin-bottom:10px;font-weight:550}
.crumb .ico{width:15px;height:15px}
.crumb a:hover{color:var(--fg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:9px;border:1px solid transparent;font-weight:650;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .08s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn .ico{width:17px;height:17px}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--fg)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-danger{background:var(--danger);color:oklch(0.99 0 0)}
.btn-outline-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn-block{width:100%}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.card-pad{padding:22px}
.card-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.card-head h2{font-family:var(--font-display);font-size:18px}
.card-head .page-actions{margin-left:auto}
.grid{display:grid;gap:16px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow-sm)}
.metric .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.metric .v{font-family:var(--font-display);font-size:32px;line-height:1.1;margin-top:8px;color:var(--fg-strong)}
.metric .d{color:var(--muted);font-size:12.5px;margin-top:2px}
.metric.accent .v{color:var(--accent-weak-fg)}

.chip{display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:650;border:1px solid transparent;white-space:nowrap;line-height:1}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip--plain::before{display:none}
.chip-neutral{background:var(--surface-2);color:var(--muted);border-color:var(--border)}
.dark .chip-neutral{color:var(--muted)}
.chip-primary{background:var(--primary-weak);color:var(--primary-weak-fg)}
.chip-warn{background:var(--warn-weak);color:var(--warn-weak-fg)}
.chip-danger{background:var(--danger-weak);color:var(--danger-weak-fg)}
.chip-success{background:var(--success-weak);color:var(--success-weak-fg)}
.chip-accent{background:var(--accent-weak);color:var(--accent-weak-fg)}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.row-link{cursor:pointer}
td .who{display:flex;align-items:center;gap:10px}
td .who small{display:block;color:var(--faint);font-size:11.5px}
.ta-right{text-align:right}
.cell-strong{font-weight:600;color:var(--fg-strong)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1;min-width:200px}
.search{position:relative;flex:1;min-width:200px}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);width:17px;height:17px}
.search .input{padding-left:38px}
.filter-select{height:40px;border:1px solid var(--border-strong);background:var(--surface);border-radius:9px;padding:0 12px;color:var(--fg);font:inherit;font-weight:550;cursor:pointer}
.toolbar .page-actions{margin-left:auto}

.field{margin-bottom:16px}
.field>label{display:block;font-weight:650;font-size:13px;margin-bottom:6px;color:var(--fg-strong)}
.field .hint{color:var(--muted);font-size:12px;margin-top:5px}
.req{color:var(--danger)}
.input,.select,.textarea{width:100%;border:1px solid var(--border-strong);background:var(--surface);border-radius:9px;padding:9px 12px;font:inherit;color:var(--fg);transition:border-color .16s,box-shadow .16s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring)}
.input[aria-invalid="true"],.textarea[aria-invalid="true"]{border-color:var(--danger)}
.input[disabled],.select[disabled]{background:var(--surface-2);color:var(--faint);cursor:not-allowed}
.textarea{min-height:100px;resize:vertical;line-height:1.6}
.char-count{float:right;color:var(--faint);font-size:11.5px;font-weight:550}
.field-error{color:var(--danger-weak-fg);font-size:12.5px;margin-top:6px;font-weight:600;display:flex;gap:6px;align-items:center}
.field-error .ico{width:15px;height:15px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto}
.tab{padding:11px 15px;border:0;background:none;color:var(--muted);font-weight:650;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s,border-color .15s}
.tab.active{color:var(--primary-weak-fg);border-bottom-color:var(--primary)}

.banner{display:flex;gap:12px;padding:13px 15px;border-radius:11px;border:1px solid;margin-bottom:18px;font-size:13.5px}
.banner .ico{width:19px;height:19px;margin-top:1px}
.banner b{display:block;margin-bottom:1px}
.banner-info{background:var(--accent-weak);border-color:color-mix(in oklch,var(--accent) 28%,transparent);color:var(--accent-weak-fg)}
.banner-warn{background:var(--warn-weak);border-color:color-mix(in oklch,var(--warn) 32%,transparent);color:var(--warn-weak-fg)}
.banner-danger{background:var(--danger-weak);border-color:color-mix(in oklch,var(--danger) 30%,transparent);color:var(--danger-weak-fg)}
.banner .banner-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

.empty{text-align:center;padding:52px 24px;color:var(--muted)}
.empty .ico{width:34px;height:34px;color:var(--faint);margin-bottom:10px}
.empty h3{font-family:var(--font-display);font-size:17px;color:var(--fg);margin-bottom:4px}
.empty p{max-width:44ch;margin:0 auto 16px}

.vcards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow-sm)}
.vcard.live{border-color:color-mix(in oklch,var(--primary) 40%,var(--border))}
.vcard .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.vcard .v{font-family:var(--font-display);font-size:24px;margin-top:6px;color:var(--fg-strong);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vcard .s{margin-top:8px}
.vcard-link{color:inherit;display:inline-flex;align-items:center;gap:8px;border-bottom:2px solid transparent;padding-bottom:1px}
.vcard-link .ico{width:17px;height:17px;color:var(--muted)}
.vlink{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:650;color:var(--primary-weak-fg)}
.vlink .ico{width:14px;height:14px}
.vswitch{display:inline-flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:4px;margin:0 0 18px}
.vswitch-btn{padding:8px 14px;border-radius:7px;font-weight:650;font-size:13px;color:var(--muted);transition:background .15s,color .15s}
.vswitch-btn.active{background:var(--surface);color:var(--primary-weak-fg);box-shadow:var(--shadow-sm)}

.section{margin-bottom:22px}
.section h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:11px;font-weight:700}
.section ul,.section ol{margin:0;padding-left:20px}
.section li{margin-bottom:7px}
.activities{border:1px solid var(--border);border-radius:11px;overflow:hidden}
.act-row{display:grid;grid-template-columns:104px 1fr;border-bottom:1px solid var(--border)}
.act-row:last-child{border-bottom:0}
.act-time{padding:12px 14px;background:var(--surface-2);font-family:var(--font-mono);font-size:12px;color:var(--muted);font-weight:600}

.tl{position:relative;padding-left:28px;margin-top:6px}
.tl-item{position:relative;padding-bottom:22px}
.tl-item::before{content:"";position:absolute;left:-24px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--primary)}
.tl-item.current::before{background:var(--primary)}
.tl-item::after{content:"";position:absolute;left:-18.5px;top:20px;bottom:2px;width:2px;background:var(--border)}
.tl-item:last-child::after{display:none}
.vmeta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:9px;font-size:12.5px;color:var(--muted)}
.vmeta b{color:var(--fg)}
.decision{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-top:11px;font-size:13px}
.decision .dhead{display:flex;align-items:center;gap:8px;font-weight:650;color:var(--fg);margin-bottom:3px}
.decision .dhead .ico{width:16px;height:16px}

.split{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:24px;align-items:start}
.side{position:sticky;top:calc(var(--topbar-h) + 20px)}
.decision-panel{padding:20px}
.role-locked{text-align:center;padding:26px 18px;color:var(--muted)}
.role-locked .ico{width:30px;height:30px;color:var(--faint);margin-bottom:10px}
.role-locked b{display:block;color:var(--fg);margin-bottom:5px;font-size:14px}

.repeat-row{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.repeat-row .input{flex:1}
.repeat-row .grow{flex:1}
.icon-btn.sm{width:38px;height:38px}
.act-edit{display:grid;grid-template-columns:96px 1fr auto;gap:10px;margin-bottom:10px;align-items:start}

.forbidden{display:grid;place-items:center;min-height:58vh}
.forbidden .card{max-width:460px;text-align:center;padding:40px 32px}
.forbidden .lock{width:56px;height:56px;border-radius:16px;background:var(--danger-weak);color:var(--danger-weak-fg);display:grid;place-items:center;margin:0 auto 18px}
.forbidden .lock .ico{width:28px;height:28px}
.forbidden h1{font-family:var(--font-display);font-size:23px;margin-bottom:8px}

.sk{background:linear-gradient(90deg,var(--surface-2) 25%,color-mix(in oklch,var(--fg) 8%,var(--surface-2)) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:shimmer 1.3s ease-in-out infinite;border-radius:8px}
.sk-row{height:16px;margin-bottom:12px}
.skspace{display:grid;gap:16px;margin-top:20px}

.modal-root{position:fixed;inset:0;z-index:100;display:none}
.modal-root.has-modal{display:block}
.modal-backdrop{position:absolute;inset:0;background:oklch(0.2 0.02 262 / .5);backdrop-filter:blur(2px);animation:fade .18s ease}
.modal{position:relative;margin:6vh auto 0;width:min(560px,calc(100% - 32px));max-height:88vh;overflow:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);border:1px solid var(--border);animation:pop .2s ease}
.modal-head{padding:22px 24px 0;display:flex;gap:14px;align-items:flex-start}
.modal-head h2{font-family:var(--font-display);font-size:20px}
.modal-head p{color:var(--muted);margin-top:4px;font-size:13.5px}
.modal-head .icon-btn{margin-left:auto;margin-top:-4px}
.modal-body{padding:18px 24px 4px}
.modal-foot{padding:16px 24px 22px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

.toast-root{position:fixed;right:22px;bottom:22px;z-index:120;display:flex;flex-direction:column;gap:11px;max-width:390px}
.toast{display:flex;gap:12px;background:var(--surface);border:1px solid var(--border);border-left:3.5px solid var(--accent);border-radius:12px;box-shadow:var(--shadow-md);padding:14px 15px;animation:slidein .24s ease}
.toast .ico{width:19px;height:19px;margin-top:1px}
.toast.success{border-left-color:var(--success)}
.toast.success .ico{color:var(--success-weak-fg)}
.toast.error{border-left-color:var(--danger)}
.toast.error .ico{color:var(--danger-weak-fg)}
.toast.warn{border-left-color:var(--warn)}
.toast.warn .ico{color:var(--warn-weak-fg)}
.toast.info .ico{color:var(--accent-weak-fg)}
.toast b{display:block;font-size:13.5px}
.toast p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.toast .icon-btn{margin-left:auto;width:28px;height:28px;flex:none}

.callout-note{display:grid;gap:2px}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block;box-shadow:0 0 0 3px var(--success-weak)}
.dot-draft{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.sep{color:var(--faint)}

@media (hover:hover){
  .nav-item:hover{background:color-mix(in oklch,var(--fg) 6%,transparent);color:var(--fg)}
  .icon-btn:hover{background:var(--surface-2);color:var(--fg)}
  .btn-primary:hover{background:var(--primary-hover)}
  .btn-secondary:hover{background:var(--surface-2);border-color:var(--faint)}
  .btn-ghost:hover{background:color-mix(in oklch,var(--fg) 7%,transparent);color:var(--fg)}
  .btn-danger:hover{background:var(--danger-hover)}
  .btn-outline-danger:hover{background:var(--danger-weak)}
  .tab:hover{color:var(--fg)}
  .menu-item:hover{background:var(--surface-2)}
  .menu-item.danger:hover{background:var(--danger-weak)}
  tbody tr:hover{background:color-mix(in oklch,var(--primary) 4%,transparent)}
  .avatar-btn:hover{border-color:var(--border-strong)}
  .row-link:hover .cell-strong{color:var(--primary-weak-fg)}
  .vcard-link:hover{border-bottom-color:var(--primary)}
  .vlink:hover{text-decoration:underline}
  .vswitch-btn:hover{color:var(--fg)}
}
@media (max-width:1024px){
  .shell{grid-template-columns:1fr}
  .nav{position:fixed;left:0;top:0;bottom:0;width:282px;transform:translateX(-100%);transition:transform .24s cubic-bezier(.2,.7,.2,1);box-shadow:var(--shadow-lg);height:100dvh}
  .nav.open{transform:none}
  .nav-backdrop{display:block;position:fixed;inset:0;background:oklch(0.2 0.02 262 / .45);z-index:55;opacity:0;pointer-events:none;transition:opacity .24s}
  .nav-backdrop.show{opacity:1;pointer-events:auto}
  .nav-toggle{display:grid}
  .split{grid-template-columns:1fr}
  .side{position:static}
}
@media (max-width:720px){
  .main{padding:20px 16px 70px}
  .topbar{padding:10px 14px;gap:10px}
  .avatar-meta{display:none}
  .role-switch-label{display:none}
  .role-switch{padding:4px 6px}
  .page-head h1{font-size:23px}
  .vcards{grid-template-columns:1fr}
  .modal{margin-top:3vh}
  .toast-root{left:14px;right:14px;bottom:14px;max-width:none}
  .act-edit{grid-template-columns:1fr}
  .act-row{grid-template-columns:84px 1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}

NAV['Super admin']=[{label:'Overview',icon:'grid',route:'/',id:'nav-overview'},{label:'Schools',icon:'school',route:'/schools',id:'nav-schools'}];

NAV['HOD']=[{label:'Overview',icon:'grid',route:'/',id:'nav-overview'},{label:'My lesson plans',icon:'book',route:'/lesson-plans',id:'nav-lesson-plans'},{label:'Review queue',icon:'review',route:'/review',id:'nav-review'}];
NAV['Dean']=[{label:'Overview',icon:'grid',route:'/',id:'nav-overview'},{label:'Approval queue',icon:'approve',route:'/approval',id:'nav-approval'}];

function segs(){return (location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);}
function resolveRoute(){
  var s=segs(),u=currentUser(),r;
  if(!s.length){r={name:'overview',params:{},title:'Overview'};}
  else if(s[0]==='schools'){ if(!s[1]){r={name:'schools',params:{},title:'Schools'};} else {var sc=DB.schools.filter(function(x){return x.id===s[1];})[0];r={name:'school',params:{id:s[1]},title:sc?sc.name:'School'};} }
  else if(s[0]==='lesson-plans'){
    if(s[1]==='new'){r={name:'editor',params:{mode:'new'},title:'New lesson plan'};}
    else if(s[2]==='edit'){var p=findPlan(s[1]);r={name:'editor',params:{id:s[1]},title:'Edit lesson plan'};}
    else if(s[2]==='versions'&&s[3]){var pv=findPlan(s[1]);r={name:'version',params:{id:s[1],v:+s[3]},title:(pv?pv.title:'Lesson plan')+' — version '+s[3]};}
    else if(s[1]){var p2=findPlan(s[1]);r={name:'plan',params:{id:s[1]},title:p2?p2.title:'Lesson plan'};}
    else {r={name:'plans',params:{},title:'My lesson plans'};}
    r.dept=u.departmentId;
  }
  else if(s[0]==='review'){ if(s[1]){r={name:'decision',params:{id:s[1],v:+s[2],kind:'hod'},title:'Review lesson plan'};} else {r={name:'reviewQueue',params:{},title:'Review queue'};} }
  else if(s[0]==='approval'){ if(s[1]){r={name:'decision',params:{id:s[1],v:+s[2],kind:'dean'},title:'Approval decision'};} else {r={name:'approvalQueue',params:{},title:'Approval queue'};} }
  else {r={name:'notfound',params:{},title:'Not found'};}
  r.allowed=isAllowed(r,u);
  return r;
}
function isAllowed(r,u){
  switch(r.name){
    case 'overview':return true;
    case 'schools':return u.role==='Super admin';
    case 'school':return u.role==='Super admin'||(u.role==='School admin'&&r.params.id==='nhs');
    case 'plans':return u.role==='Teacher'||u.role==='HOD';
    case 'editor':return u.role==='Teacher'||u.role==='HOD';
    case 'plan':return true;
    case 'version':return true;
    case 'reviewQueue':case 'decision':return r.params&&r.params.kind==='dean'?(u.role==='Dean'):(u.role==='HOD');
    case 'approvalQueue':return u.role==='Dean';
    default:return true;
  }
}

function planHTML(id){
  var p=findPlan(id);if(!p)return notFoundHTML();

    h+='<div class="banner banner-danger" data-od-id="conflict-banner">'+icon('alertTri')+'<div><b>This plan changed since you opened it.</b>Version '+p.conflict.serverVersion+' is now current. Reload to continue.</div><div class="banner-actions"><button class="btn btn-danger btn-sm" data-act="reload-conflict" data-id="'+p.id+'">'+icon('refresh')+'Reload</button></div></div>';
  }

function actionable(v,u,p){return (u.id===p.authorId&&(p.liveVersion!==v.n))||v.status==='Draft';}
function planActions(v,u,p){
  var a='';

    if(v.status==='Draft'||v.status==='Changes requested')a+='<button class="btn btn-primary" data-act="submit-plan" data-id="'+p.id+'" data-od-id="cta-submit">'+icon('send')+'Submit for HOD review</button>';
    if(v.status==='Approved')a+='<button class="btn btn-primary" data-act="publish-plan" data-id="'+p.id+'" data-od-id="cta-publish">'+icon('upload')+'Publish</button>';
    if(v.status==='Published')a+='<span class="chip chip-primary">Live version — '+v.n+'</span>';

function contentHTML(c){

function decisionLine(label,d){

    '<div class="vmeta" style="margin-top:0"><span>Author: <b>'+esc(v.author)+'</b></span><span>Saved: <b>'+esc(v.savedAt||'—')+'</b></span>'+(v.submittedAt?'<span>Submitted: <b>'+esc(v.submittedAt)+'</b></span>':'')+'</div>'+

function initEditor(p,isNew){

  {planId:p.id,nextN:p.versions.length+1,title:p.title,objectives:c.objectives.slice(),materials:c.materials.slice(),activities:c.activities.map(function(a){return {time:a.time,title:a.title,detail:a.detail};}),assessment:c.assessment,summary:''};

function toastsHTML(){
  return state.toasts.map(function(t){
    var ic=t.type==='success'?'check':t.type==='error'?'alertTri':t.type==='warn'?'clock':'info';

function toast(type,title,msg){
  var id=++state.toastSeq;state.toasts.push({id:id,type:type,title:title,msg:msg});
  render();
  setTimeout(function(){state.toasts=state.toasts.filter(function(t){return t.id!==id;});render();},4800);
}
function openModal(type,extra){state.modal=Object.assign({type:type},extra||{});state.menuOpen=false;render();setTimeout(focusModal,30);}
function closeModal(){state.modal=null;render();}
function focusModal(){var el=document.querySelector('.modal input,.modal select,.modal textarea,.modal button');if(el)el.focus();}
function go(hash){if(('#'+hash)!==location.hash)navigate(hash);}
function navigate(hash){location.hash=hash;}

function render(){
  var main=document.getElementById('main'),scroll=main?main.scrollTop:0;
  state.resolved=resolveRoute();
  document.documentElement.classList.toggle('dark',state.theme==='dark');
  app.innerHTML=shell();
  var nm=document.getElementById('main');if(nm)nm.scrollTop=scroll;
  if(state.focusId){var f=document.getElementById(state.focusId);if(f){f.focus();try{if(f.setSelectionRange)f.setSelectionRange(f.value.length,f.value.length);}catch(e){}}state.focusId=null;}
}
function handleHash(){
  state.loading=true;state.menuOpen=false;state.navOpen=false;state.modal=null;state.editor=null;state.decision=null;
  render();
  clearTimeout(loadTimer);
  loadTimer=setTimeout(function(){state.loading=false;render();},480);
}
window.addEventListener('hashchange',handleHash);

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t){
    if(state.menuOpen){state.menuOpen=false;render();}
    if(state.navOpen&&!e.target.closest('.nav')){state.navOpen=false;render();}
    return;
  }
  var act=t.dataset.act;var id=t.dataset.id;
  if(act==='skip'){e.preventDefault();var m=document.getElementById('main');if(m)m.focus();return;}
  if(act==='toggle-nav'){state.navOpen=!state.navOpen;render();return;}
  if(act==='close-nav'){state.navOpen=false;render();return;}
  if(act==='toggle-theme'){state.theme=state.theme==='dark'?'light':'dark';try{localStorage.setItem('scrm-theme',state.theme);}catch(err){}render();return;}
  if(act==='toggle-menu'){state.menuOpen=!state.menuOpen;render();return;}
  if(act==='signout'){state.menuOpen=false;toast('info','Signed out','This is a prototype — you remain signed in to the demo.');return;}
  if(act==='reset'){DB=seed();state.filters={q:'',schoolStatus:'all',cap:'all',dept:'all',status:'all'};state.menuOpen=false;state.editor=null;state.schoolTab='departments';go('/');toast('success','Sample data reset','All schools, memberships and lesson plans are back to their starting state.');return;}
  if(act==='open-modal'){openModal(t.dataset.modal,{id:id,schoolId:'nhs'});return;}
  if(act==='close-modal'){closeModal();return;}
  if(act==='submit-form'){submitForm(t.dataset.form,id);return;}
  if(act==='tab'){state.schoolTab=t.dataset.tab;render();return;}
  if(act==='open-school'){go('/schools/'+id);return;}
  if(act==='open-plan'){go('/lesson-plans/'+id);return;}
  if(act==='open-decision'){go((t.dataset.kind==='hod'?'/review/':'/approval/')+id+'/'+t.dataset.v);return;}
  if(act==='go-overview'){return;}
  if(act==='toast-close'){state.toasts=state.toasts.filter(function(x){return x.id!=id;});render();return;}
  if(act==='toast'){toast(t.dataset.kind||'info',t.dataset.title||'Not available',t.dataset.msg||'');return;}
  if(act==='editor-add'){addEditor(t.dataset.kind);return;}
  if(act==='editor-remove'){removeEditor(t.dataset.kind,+t.dataset.index);return;}
  if(act==='save-plan'){savePlan();return;}
  if(act==='cancel-editor'){state.editor=null;history.length>1?history.back():go('/lesson-plans');return;}
  if(act==='submit-plan'){doSubmit(id);return;}
  if(act==='publish-plan'){doPublish(id);return;}
  if(act==='reload-conflict'){doReload(id);return;}
  if(act==='approve'){doDecision(id,t.dataset.kind,'Approved');return;}
  if(act==='request-changes'){doDecision(id,t.dataset.kind,'Changes requested');return;}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.act==='set-role'){state.role=t.value;state.loading=false;state.modal=null;state.editor=null;state.menuOpen=false;render();toast('info','Viewing as '+t.value,'Navigation and permissions now reflect this role.');return;}
  if(t.dataset.modalSelect==='capability'){state.modal.capability=t.value;if(t.value==='Manages members')state.modal.department='';render();return;}
  if(t.dataset.modalSelect){state.modal[t.dataset.modalSelect]=t.value;render();return;}
  if(t.dataset.filter){state.filters[t.dataset.filter]=t.value;render();return;}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.editor){onEditorInput(t);return;}
  if(t.dataset.counter){var o=document.getElementById(t.dataset.counter);if(o)o.textContent=t.value.length+'/'+(t.maxLength>0?t.maxLength:2000);return;}
  if(t.dataset.modalInput){state.modal[t.dataset.modalInput]=t.value;if(state.modal.error)state.modal.error=null;var c=document.getElementById('cs-count');if(c&&t.id==='cs-name')c.textContent=t.value.length+'/200';return;}
  if(t.dataset.filter){state.filters[t.dataset.filter]=t.value;if(t.dataset.focusid)state.focusId=t.dataset.focusid;var f=document.getElementById(t.id);var pos=f?f.selectionStart:null;render();return;}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(state.modal){closeModal();}else if(state.menuOpen){state.menuOpen=false;render();}else if(state.navOpen){state.navOpen=false;render();}return;}
  if(e.key==='Tab'&&state.modal){trapFocus(e);}
});
function trapFocus(e){
  var modal=document.querySelector('.modal');if(!modal)return;
  var f=modal.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');
  if(!f.length)return;var first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
}
function onEditorInput(t){
  var f=t.dataset.editor,idx=+t.dataset.index,e=state.editor;if(!e)return;
  if(f==='title')e.title=t.value;
  else if(f==='assessment')e.assessment=t.value;
  else if(f==='summary')e.summary=t.value;
  else if(f==='objectives')e.objectives[idx]=t.value;
  else if(f==='materials')e.materials[idx]=t.value;
  else if(f==='act-time')e.activities[idx].time=t.value;
  else if(f==='act-title')e.activities[idx].title=t.value;
  else if(f==='act-detail')e.activities[idx].detail=t.value;
}
function addEditor(kind){
  var e=state.editor;if(!e)return;
  if(kind==='objectives')e.objectives.push('');
  else if(kind==='materials')e.materials.push('');
  else if(kind==='activities')e.activities.push({time:'',title:'',detail:''});
  render();
}
function removeEditor(kind,idx){
  var e=state.editor;if(!e)return;
  if(kind==='objectives'&&e.objectives.length>1)e.objectives.splice(idx,1);
  else if(kind==='materials'&&e.materials.length>1)e.materials.splice(idx,1);
  else if(kind==='activities'&&e.activities.length>1)e.activities.splice(idx,1);
  render();
}
function editorContent(e){
  return {objectives:e.objectives.filter(function(x){return x.trim();}),materials:e.materials.filter(function(x){return x.trim();}),activities:e.activities.filter(function(x){return x.title.trim()||x.detail.trim();}),assessment:e.assessment.trim()};
}
function savePlan(){
  var e=state.editor;if(!e)return;
  if(!e.title.trim()){toast('error','Title required','Give the lesson plan a title before saving.');return;}
  if(!e.summary.trim()){toast('error','Change summary required','Describe what changed in this version.');return;}
  var isNew=e.planId==='__new';
  if(!isNew){
    var p=findPlan(e.planId);
    if(p.conflict){toast('error','This plan changed since you opened it','Version '+p.conflict.serverVersion+' is now current. Your changes were not saved. Reload to continue.');return;}
  }
  var content=editorContent(e);
  if(isNew){
    var np={id:'lp-'+Date.now(),title:e.title.trim(),departmentId:currentUser().departmentId,authorId:currentUser().id,author:currentUser().name,updated:today(),liveVersion:null,versions:[]};
    np.versions.push(mkVer({n:1,status:'Draft',savedAt:today(),summary:e.summary.trim(),authorId:currentUser().id,author:currentUser().name,content:content}));
    DB.plans.push(np);state.editor=null;toast('success','Version 1 saved','Your new lesson plan was created as a private draft.');go('/lesson-plans/'+np.id);return;
  }
  var p2=findPlan(e.planId),n=p2.versions.length+1;
  p2.versions.push(mkVer({n:n,status:'Draft',savedAt:today(),summary:e.summary.trim(),authorId:currentUser().id,author:currentUser().name,content:content}));
  p2.updated=today();state.editor=null;toast('success','Version '+n+' saved','Approvals were cleared. The published version stays live.');go('/lesson-plans/'+p2.id);
}
function doSubmit(id){
  var p=findPlan(id),v=curVer(p);
  if(v.status!=='Draft'&&v.status!=='Changes requested')return;
  v.status='In HOD review';v.submittedAt=today();
  toast('success','Submitted for HOD review','Version '+v.n+' is now with '+((DB.users.filter(function(u){return u.role==='HOD'&&u.departmentId===p.departmentId;})[0]||{name:'your HOD'}).name)+'.');
  go('/lesson-plans/'+id);
}
function doPublish(id){
  var p=findPlan(id),v=curVer(p);
  if(v.status!=='Approved')return;
  v.status='Published';p.liveVersion=v.n;p.updated=today();
  toast('success','Version '+v.n+' published','It is now the live version for this lesson plan.');
  go('/lesson-plans/'+id);
}
function doReload(id){
  var p=findPlan(id);
  if(!p.conflict)return;
  var c=p.conflict;
  p.versions.push(mkVer({n:c.serverVersion,status:'Draft',savedAt:c.at,summary:c.summary,authorId:p.authorId,author:p.author,content:curVer(p).content}));
  p.updated=c.at;p.conflict=null;state.editor=null;
  toast('info','Reloaded version '+c.serverVersion,'The latest version is now shown. Your earlier unsaved edits were discarded.');
  render();
}
function doDecision(id,kind,decision){
  var p=findPlan(id),v=curVer(p),u=currentUser();
  if(decision==='Changes requested'){
    var ta=document.getElementById('fb-'+kind);
    var fb=ta?ta.value.trim():'';
    if(!fb){toast('error','Feedback required','Add a note explaining the changes needed before requesting changes.');if(ta)ta.focus();return;}
    if(kind==='hod'){v.status='Changes requested';v.hod=dec(u.name,today(),'Changes requested',fb);}
    else {v.status='Changes requested';v.dean=dec(u.name,today(),'Changes requested',fb);}
    toast('warn','Changes requested','Your feedback was sent to the author.');
  } else {
    if(kind==='hod'){v.status='In dean approval';v.hod=dec(u.name,today(),'Approved','');toast('success','Approved','Version '+v.n+' now moves to dean approval.');}
    else {v.status='Approved';v.dean=dec(u.name,today(),'Approved','');toast('success','Approved','The author can now publish this version.');}
  }
  p.updated=today();
  go(kind==='hod'?'/review':'/approval');
}
function submitForm(kind,id){
  if(kind==='createSchool'){
    var name=(state.modal.name||'').trim();
    if(name.length<1||name.length>200){state.modal.error='name';render();return;}
    var ns={id:'sch-'+Date.now(),name:name,county:'—',status:'Onboarding',created:today(),departments:[]};
    DB.schools.push(ns);closeModal();toast('success','School created',name+' was added. Add its departments next.');go('/schools/'+ns.id);return;
  }
  if(kind==='addDept'){
    var s=DB.schools[0],dn=(state.modal.name||'').trim();
    if(!dn||s.departments.filter(function(d){return d.name.toLowerCase()===dn.toLowerCase();}).length){state.modal.error='dept';render();return;}
    s.departments.push({id:'d-'+Date.now(),name:dn,hod:'—'});closeModal();toast('success','Department added',dn+' was added to '+s.name+'.');render();return;
  }
  if(kind==='grant'){
    var m=state.modal,need=m.capability&&m.capability!=='Manages members';
    if(!m.user||!m.capability||(need&&!m.department)){m.error='fields';m.errorMsg=!m.user?'Select a user.':!m.capability?'Select a capability.':'Select a department — it is required for this capability.';render();return;}
    if(m.capability==='Manages members'&&currentUser().role!=='Super admin'){m.error='fields';m.errorMsg='Only a super admin can grant “Manages members”.';render();return;}
    DB.memberships.push({id:'m-'+Date.now(),userId:m.user,capability:m.capability,department:need?m.department:'',status:'Active',updated:today()});
    var un=userById(m.user).name;closeModal();toast('success','Capability granted',un+' can now '+ (m.capability==='Teaches'?'teach':m.capability==='Manages members'?'manage members':m.capability==='Reviews lessons (HOD)'?'review lessons':'approve lessons')+'.');render();return;
  }
  if(kind==='revoke'){
    var mem=DB.memberships.filter(function(x){return x.id===state.modal.id;})[0];
    if(mem){mem.status='Revoked';mem.updated=today();var rn=userById(mem.userId);closeModal();toast('success','Capability revoked',(rn?rn.name:'User')+' lost access immediately. The row remains as history.');render();}
    return;
  }
}

(function init(){
  try{var th=localStorage.getItem('scrm-theme');if(th==='dark')state.theme='dark';}catch(e){}
  if(!location.hash)location.hash='#/';
  state.resolved=resolveRoute();
  document.documentElement.classList.toggle('dark',state.theme==='dark');
  app.innerHTML=shell();
})();
</script>
</body>
</html>
